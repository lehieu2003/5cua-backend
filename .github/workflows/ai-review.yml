name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/ai-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: glm-4.6
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
