name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Type check (Lint)
        run: npm run lint

      - name: Compile TypeScript
        run: npm run build

      - name: Run unit tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/5cua_farm_db?schema=public"
          JWT_ACCESS_SECRET: "ci_test_access_secret_64_characters_long_super_secure_key_1234567890"
          JWT_REFRESH_SECRET: "ci_test_refresh_secret_64_characters_long_super_secure_key_1234567890"
